<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050b16">
  <title>Monero Farm Panel</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="login" class="login-screen">
    <form id="login-form" class="panel login-card">
      <div class="brand brand-full"><span class="brand-mark brand-mark-image" aria-hidden="true"></span><span class="brand-copy"><strong>Monero Farm Panel</strong><small>MONERO MINING CONTROL</small></span></div>
      <h1 data-i18n="login.title">Вход</h1><p class="muted" data-i18n="login.subtitle">Централизованное управление RandomX / XMRig / p2pool</p>
      <label><span data-i18n="login.masterPassword">Мастер-пароль</span><input id="login-password" type="password" autocomplete="current-password" required autofocus></label>
      <button class="primary" type="submit" data-i18n="login.submit">Войти</button><div class="login-language language-switch" role="group" data-i18n-title="app.language" title="Язык интерфейса"><button type="button" data-locale="ru">RU</button><button type="button" data-locale="en">EN</button></div><div id="login-error" class="error"></div>
    </form>
  </div>
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brand brand-compact"><span class="brand-mark brand-mark-image" aria-hidden="true"></span><span class="brand-copy"><strong>MFP</strong><small>MONERO FARM PANEL</small></span></div>
      <nav>
        <button data-page="dashboard" class="nav active"><span class="nav-icon nav-icon-dashboard" aria-hidden="true"></span><b data-i18n="nav.dashboard">Дашборд</b></button>
        <button data-page="servers" class="nav"><span class="nav-icon nav-icon-servers" aria-hidden="true"></span><b data-i18n="nav.servers">Серверы</b></button>
        <button data-page="operations" class="nav"><span class="nav-icon nav-icon-operations" aria-hidden="true"></span><b data-i18n="nav.operations">Операции</b></button>
        <button data-page="updates" class="nav"><span class="nav-icon nav-icon-updates" aria-hidden="true"></span><b data-i18n="nav.updates">Обновления</b></button>
        <button data-page="topology" class="nav" data-i18n-title="nav.topologyTip" title="Схема связей майнеров, пулов и узлов"><span class="nav-icon nav-icon-topology" aria-hidden="true"></span><b data-i18n="nav.topology">Топология</b></button>
        <button data-page="proxies" class="nav" data-i18n-title="nav.proxyTip" title="XMRig Proxy: воркеры, хешрейт, shares и upstream"><span class="nav-icon nav-icon-proxy" aria-hidden="true"></span><b>XMRig Proxy</b></button>
        <button data-page="settings" class="nav"><span class="nav-icon nav-icon-settings" aria-hidden="true"></span><b data-i18n="nav.settings">Настройки</b></button>
        <button data-page="audit" class="nav" data-i18n-title="nav.auditTip" title="Журнал действий панели"><span class="nav-icon nav-icon-audit" aria-hidden="true"></span><b data-i18n="nav.audit">Журнал</b></button>
        <button data-page="docs" class="nav" data-i18n-title="nav.docsTip" title="Краткое описание всех функций панели"><span class="nav-icon nav-icon-docs" aria-hidden="true"></span><b data-i18n="nav.docs">Документация</b></button>
      </nav>
      <div class="sidebar-bottom"><div class="language-switch sidebar-language" role="group" data-i18n-title="app.language" title="Язык интерфейса"><button type="button" data-locale="ru">RU</button><button type="button" data-locale="en">EN</button></div><span id="socket-state" class="pill">нет связи</span><button id="logout" class="ghost" data-i18n="auth.logout">Выйти</button></div>
    </aside>
    <main class="content">
      <header class="topbar"><div><h1 id="page-title" data-i18n="header.dashboard">Дашборд</h1><div id="page-subtitle" class="muted" data-i18n="header.monitoring">Мониторинг фермы</div></div><div id="top-actions"><button id="add-server" class="primary" data-i18n="action.addServer">+ Сервер</button></div></header>
      <section id="view"></section>
    </main>
  </div>
  <dialog id="modal"><div id="modal-body"></div></dialog>
  <script src="/socket.io/socket.io.js"></script><script type="module" src="/app.js"></script>
</body>
</html>
